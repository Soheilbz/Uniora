name: univ-web

x-runtime-security: &runtime-security
  restart: unless-stopped
  # Production consumes pre-qualified images only. A missing image must fail
  # closed instead of causing an implicit registry pull or local build.
  pull_policy: never
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=128m,mode=1777
  stop_grace_period: 30s
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "5"

x-tool-security: &tool-security
  pull_policy: never
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=128m,mode=1777
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "5"

services:
  web:
    <<: *runtime-security
    user: "${UNIV_RUNTIME_UID:-1000}:${UNIV_RUNTIME_GID:-1000}"
    image: ${UNIV_WEB_IMAGE:-univ-web:0.8.2}
    env_file:
      - ${UNIV_WEB_WEB_ENV_FILE:-/etc/univ-web/web.env}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      EXPORT_JOB_DIR: /var/lib/univ-web/exports
    ports:
      - "127.0.0.1:${UNIV_WEB_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ${UNIV_DATA_ROOT:-/var/lib/univ-web}/exports
        target: /var/lib/univ-web/exports
        read_only: true

  job-worker:
    <<: *runtime-security
    user: "${UNIV_RUNTIME_UID:-1000}:${UNIV_RUNTIME_GID:-1000}"
    image: ${UNIV_TENANT_WORKER_IMAGE:-univ-web-tenant-worker:0.8.2}
    command: ["node", "scripts/job-worker.mjs"]
    env_file:
      - ${UNIV_WEB_WORKER_ENV_FILE:-/etc/univ-web/worker.env}
    environment:
      EXPORT_JOB_DIR: /var/lib/univ-web/exports
    volumes:
      - type: bind
        source: ${UNIV_DATA_ROOT:-/var/lib/univ-web}/exports
        target: /var/lib/univ-web/exports

  platform-worker:
    <<: *runtime-security
    user: "${UNIV_RUNTIME_UID:-1000}:${UNIV_RUNTIME_GID:-1000}"
    image: ${UNIV_PLATFORM_WORKER_IMAGE:-univ-web-platform-worker:0.8.2}
    command: ["node", "scripts/platform-worker.js"]
    env_file:
      - ${UNIV_WEB_PLATFORM_WORKER_ENV_FILE:-/etc/univ-web/platform-worker.env}
    environment:
      BACKUP_DIR: /var/lib/univ-web/backups
    volumes:
      - type: bind
        source: ${UNIV_DATA_ROOT:-/var/lib/univ-web}/backups
        target: /var/lib/univ-web/backups

  # One-shot privileged maintenance container. It is behind an explicit profile
  # so `docker compose up` never turns database-owner/role-provisioning secrets
  # into an always-on service. Invoke it via `docker compose run operations ...`.
  operations:
    <<: *tool-security
    user: "${UNIV_RUNTIME_UID:-1000}:${UNIV_RUNTIME_GID:-1000}"
    profiles: ["tools"]
    image: ${UNIV_OPERATIONS_IMAGE:-univ-web-operations:0.8.2}
    command: ["node", "scripts/production-db-check.mjs"]
    env_file:
      - ${UNIV_WEB_OPERATIONS_ENV_FILE:-/etc/univ-web/operations.env}
    environment:
      EXPORT_JOB_DIR: /var/lib/univ-web/exports
      BACKUP_DIR: /var/lib/univ-web/backups
      AUDIT_SEAL_DIR: /var/lib/univ-web/audit-seals
      DR_REPORT_DIR: /var/lib/univ-web/dr-reports
    volumes:
      - type: bind
        source: ${UNIV_DATA_ROOT:-/var/lib/univ-web}/exports
        target: /var/lib/univ-web/exports
      - type: bind
        source: ${UNIV_DATA_ROOT:-/var/lib/univ-web}/backups
        target: /var/lib/univ-web/backups
      - type: bind
        source: ${UNIV_DATA_ROOT:-/var/lib/univ-web}/audit-seals
        target: /var/lib/univ-web/audit-seals
      - type: bind
        source: ${UNIV_DATA_ROOT:-/var/lib/univ-web}/dr-reports
        target: /var/lib/univ-web/dr-reports
