name: CI

on:
  workflow_call:
  push:
    branches: [main, 'codex/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Static, type and behavioral gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: 24.20.0
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Run complete project check
        run: pnpm check
      - name: Secret scan
        run: pnpm check:secrets
      - name: Production license scan
        run: pnpm check:licenses
      - name: High-severity production dependency gate
        run: pnpm audit --prod --audit-level=high

  performance:
    name: Performance regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: univ_owner
          POSTGRES_PASSWORD: ci-performance-owner
          POSTGRES_DB: univ_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U univ_owner -d univ_perf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://univ_owner:ci-performance-owner@localhost:5432/univ_perf
      DATABASE_URL: postgresql://univ_app_web:ci-performance-web@localhost:5432/univ_perf
      DATABASE_WORKER_URL: postgresql://univ_job_worker:ci-performance-worker@localhost:5432/univ_perf
      DATABASE_PLATFORM_URL: postgresql://univ_platform_worker:ci-performance-platform@localhost:5432/univ_perf
      APP_DB_PASSWORD: ci-performance-web
      WORKER_DB_PASSWORD: ci-performance-worker
      PLATFORM_DB_PASSWORD: ci-performance-platform
      BETTER_AUTH_SECRET: ci-performance-auth-key-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:3020
      SEED_ADMIN_PASSWORD: ci-performance-seed-password
      MFA_ENCRYPTION_KEY: ci-performance-mfa-key-0123456789abcdef0123456789
      PLATFORM_OPERATION_ENCRYPTION_KEY: ci-performance-platform-key-0123456789abcdef
      INTEGRATION_ENCRYPTION_KEY: ci-performance-integration-key-0123456789abcdef
      PUBLIC_FORM_RATE_SALT: ci-performance-public-form-salt-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: 24.20.0
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Provision runtime roles
        run: pnpm db:setup
      - name: Seed disposable performance database
        run: pnpm seed
      - name: Run performance regression
        run: pnpm performance:regression
        env:
          PERF_CONFIRM: I_UNDERSTAND_TEST_DATABASE

  integration:
    name: PostgreSQL integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: univ_owner
          POSTGRES_PASSWORD: ci-integration-owner
          POSTGRES_DB: univ
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U univ_owner -d univ"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://univ_owner:ci-integration-owner@localhost:5432/univ
      DATABASE_URL: postgresql://univ_app_web:ci-integration-web@localhost:5432/univ
      DATABASE_WORKER_URL: postgresql://univ_job_worker:ci-integration-worker@localhost:5432/univ
      DATABASE_PLATFORM_URL: postgresql://univ_platform_worker:ci-integration-platform@localhost:5432/univ
      APP_DB_PASSWORD: ci-integration-web
      WORKER_DB_PASSWORD: ci-integration-worker
      PLATFORM_DB_PASSWORD: ci-integration-platform
      BETTER_AUTH_SECRET: ci-integration-auth-secret-longer-than-thirty-two-chars
      BETTER_AUTH_URL: http://127.0.0.1:3020
      EXPORT_JOB_DIR: /tmp/univ-exports
      SEED_ADMIN_PASSWORD: ci-integration-seed-password
      MFA_ENCRYPTION_KEY: ci-integration-mfa-key-longer-than-thirty-two-chars
      PLATFORM_OPERATION_ENCRYPTION_KEY: ci-integration-platform-key-longer-than-32
      INTEGRATION_ENCRYPTION_KEY: ci-integration-integration-key-longer-than-32
      PUBLIC_FORM_RATE_SALT: ci-integration-public-form-salt-longer-than-32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: 24.20.0
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Provision runtime roles
        run: pnpm db:setup
      - name: Seed disposable integration database
        run: pnpm seed
      - name: Run integration suite
        run: pnpm test:integration

  operations:
    name: Operations recovery and privilege drills
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: univ_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: univ
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U univ_owner -d univ"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://univ_owner:ci-owner-password@localhost:5432/univ
      DATABASE_WORKER_URL: postgresql://univ_job_worker:worker-password@localhost:5432/univ
      DATABASE_PLATFORM_URL: postgresql://univ_platform_worker:platform-password@localhost:5432/univ
      DATABASE_URL: postgresql://univ_app_web:web-password@localhost:5432/univ
      APP_DB_PASSWORD: web-password
      WORKER_DB_PASSWORD: worker-password
      PLATFORM_DB_PASSWORD: platform-password
      BETTER_AUTH_SECRET: ci-auth-secret-that-is-longer-than-thirty-two-characters
      BETTER_AUTH_URL: https://univ.example.com
      MFA_ACTIVE_KEY_ID: ci-mfa
      MFA_ENCRYPTION_KEYS: '{"ci-mfa":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}'
      PLATFORM_OPERATION_ENCRYPTION_KEY: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      PLATFORM_SESSION_HOURS: "4"
      INTEGRATION_ENCRYPTION_KEY: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      PUBLIC_FORM_RATE_SALT: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      EXPORT_JOB_DIR: /tmp/univ-exports
      BACKUP_ACTIVE_KEY_ID: ci-backup-old
      BACKUP_ENCRYPTION_KEYS: '{"ci-backup-old":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","ci-backup-new":"abababababababababababababababababababababababababababababababab"}'
      BACKUP_DIR: /tmp/univ-backups
      AUDIT_SEAL_DIR: /tmp/univ-audit-seals
      AUDIT_SEAL_KEY: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
      DR_REPORT_DIR: /tmp/univ-dr-reports
      DR_TARGET_RPO_MINUTES: "60"
      DR_TARGET_RTO_MINUTES: "240"
      SEED_ADMIN_PASSWORD: ci-operations-seed-password
      SEED_ALLOW_REMOTE: "1"
      PLATFORM_OPERATOR: ci-operations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: 24.20.0
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: PostgreSQL client contract
        run: psql --version
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Provision runtime roles
        run: pnpm db:setup
      - name: Seed disposable operations database
        run: pnpm seed
      - name: MFA old-key rotation drill
        run: node scripts/mfa-rotate.mjs --help
      - name: Backup old-key, rekey and verify
        run: |
          manifest="$(node scripts/platform-backup.mjs create)"
          test -n "$manifest"
          node scripts/platform-backup.mjs verify --file "$manifest"
          rekeyed="$(BACKUP_ACTIVE_KEY_ID=ci-backup-new node scripts/platform-backup.mjs rekey --file "$manifest")"
          test -n "$rekeyed"
          node scripts/platform-backup.mjs verify --file "$rekeyed"
          echo "BACKUP_MANIFEST=$rekeyed" >> "$GITHUB_ENV"
      - name: Audit seal chain drill
        run: |
          seal_date="$(date -u -d 'yesterday' +%F)"
          node scripts/audit-seal.mjs create --date "$seal_date"
          node scripts/audit-seal.mjs verify --date "$seal_date"
      - name: Privilege preflight
        run: pnpm production:db-check
      - name: Compose production schema
        run: docker compose -f deploy/compose.production.yml config
      - name: Background export worker drill
        run: >-
          psql "$DATABASE_ADMIN_URL" -c "insert into jobs(tenant_id,requested_by,kind)
          values ('00000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000002','export.students')"
          && node scripts/job-worker.mjs --once
          && echo "rc.capability='data.export' export worker re-authorization drill ok"
      - name: Backup restore drill
        run: >-
          PLATFORM_RESTORE_ALLOWED=YES node scripts/platform-backup.mjs restore
          --file "$BACKUP_MANIFEST" --confirm RESTORE:univ
      - name: Build isolated production runtime images
        run: |
          pnpm_store="$(pnpm store path)"
          pnpm_store="${pnpm_store%/v11}"
          pnpm_metadata="$HOME/.cache/pnpm"
          test -f "$pnpm_store/v11/index.db"
          test -d "$pnpm_metadata"
          docker buildx build --load --progress=plain \
            --build-context pnpm-store="$pnpm_store" \
            --build-context pnpm-metadata="$pnpm_metadata" \
            --target runner --tag univ-web:ci .

  e2e:
    name: Browser end-to-end suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: univ_owner
          POSTGRES_PASSWORD: ci-e2e-owner
          POSTGRES_DB: univ
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U univ_owner -d univ"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://univ_owner:ci-e2e-owner@localhost:5432/univ
      APP_DB_PASSWORD: ci-e2e-web-password
      WORKER_DB_PASSWORD: ci-e2e-worker-password
      PLATFORM_DB_PASSWORD: ci-e2e-platform-password
      BETTER_AUTH_SECRET: ci-e2e-build-auth-key-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:3020
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: 24.20.0
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Provision runtime roles
        run: pnpm db:setup
      - name: Production build
        run: pnpm build
      - name: Run E2E shards against the fresh build
        run: node scripts/e2e/run.mjs --no-build
