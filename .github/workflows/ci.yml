# Full CI is required on pull requests; tagged releases call this workflow too.
# main only accepts pull requests that pass the required gates, so running the
# same expensive matrix again on the merge commit would repeat verification.
name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer commit supersedes an older candidate/main run; do not consume a
  # runner on an artifact that can no longer be the merge candidate.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Static, type and behavioral gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Unit tests import database-backed modules but do not connect to this
      # disposable URL; integration/operations jobs own all live DB checks.
      DATABASE_URL: postgresql://localhost:5432/univ
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: 24.20.0
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Run complete project check
        run: pnpm check
      - name: Secret scan
        run: pnpm check:secrets
      - name: Production license scan
        run: pnpm check:licenses
      - name: High-severity production dependency gate
        run: pnpm audit --prod --audit-level=high

  performance:
    name: Performance regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: univ_owner
          POSTGRES_PASSWORD: ci-performance-owner
          POSTGRES_DB: univ_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U univ_owner -d univ_perf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://univ_owner:ci-performance-owner@localhost:5432/univ_perf
      DATABASE_URL: postgresql://univ_app_web:ci-performance-web@localhost:5432/univ_perf
      DATABASE_WORKER_URL: postgresql://univ_job_worker:ci-performance-worker@localhost:5432/univ_perf
      DATABASE_PLATFORM_URL: postgresql://univ_platform_worker:ci-performance-platform@localhost:5432/univ_perf
      APP_DB_PASSWORD: ci-performance-web
      WORKER_DB_PASSWORD: ci-performance-worker
      PLATFORM_DB_PASSWORD: ci-performance-platform
      BETTER_AUTH_SECRET: ci-performance-auth-key-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:3020
      SEED_ADMIN_PASSWORD: ci-performance-seed-password
      MFA_ENCRYPTION_KEY: ci-performance-mfa-key-0123456789abcdef0123456789
      PLATFORM_OPERATION_ENCRYPTION_KEY: ci-performance-platform-key-0123456789abcdef
      INTEGRATION_ENCRYPTION_KEY: ci-performance-integration-key-0123456789abcdef
      PUBLIC_FORM_RATE_SALT: ci-performance-public-form-salt-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: 24.20.0
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Provision runtime roles
        run: pnpm db:setup
      - name: Seed disposable performance database
        run: pnpm seed
      - name: Run performance regression
        run: pnpm performance:regression
        env:
          PERF_CONFIRM: I_UNDERSTAND_TEST_DATABASE

  integration:
    name: PostgreSQL integration suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: univ_owner
          POSTGRES_PASSWORD: ci-integration-owner
          POSTGRES_DB: univ
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U univ_owner -d univ"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://univ_owner:ci-integration-owner@localhost:5432/univ
      DATABASE_URL: postgresql://univ_app_web:ci-integration-web@localhost:5432/univ
      DATABASE_WORKER_URL: postgresql://univ_job_worker:ci-integration-worker@localhost:5432/univ
      DATABASE_PLATFORM_URL: postgresql://univ_platform_worker:ci-integration-platform@localhost:5432/univ
      APP_DB_PASSWORD: ci-integration-web
      WORKER_DB_PASSWORD: ci-integration-worker
      PLATFORM_DB_PASSWORD: ci-integration-platform
      BETTER_AUTH_SECRET: ci-integration-auth-secret-longer-than-thirty-two-chars
      BETTER_AUTH_URL: http://127.0.0.1:3020
      EXPORT_JOB_DIR: /tmp/univ-exports
      SEED_ADMIN_PASSWORD: ci-integration-seed-password
      MFA_ENCRYPTION_KEY: ci-integration-mfa-key-longer-than-thirty-two-chars
      PLATFORM_OPERATION_ENCRYPTION_KEY: ci-integration-platform-key-longer-than-32
      INTEGRATION_ENCRYPTION_KEY: ci-integration-integration-key-longer-than-32
      PUBLIC_FORM_RATE_SALT: ci-integration-public-form-salt-longer-than-32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: 24.20.0
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Provision runtime roles
        run: pnpm db:setup
      - name: Seed disposable integration database
        run: pnpm seed
      - name: Run integration suite
        run: pnpm test:integration

  operations:
    name: Operations recovery and privilege drills
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: univ_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: univ
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U univ_owner -d univ"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://univ_owner:ci-owner-password@localhost:5432/univ
      DATABASE_WORKER_URL: postgresql://univ_job_worker:worker-password@localhost:5432/univ
      DATABASE_PLATFORM_URL: postgresql://univ_platform_worker:platform-password@localhost:5432/univ
      DATABASE_URL: postgresql://univ_app_web:web-password@localhost:5432/univ
      APP_DB_PASSWORD: web-password
      WORKER_DB_PASSWORD: worker-password
      PLATFORM_DB_PASSWORD: platform-password
      BETTER_AUTH_SECRET: ci-auth-secret-that-is-longer-than-thirty-two-characters
      BETTER_AUTH_URL: https://univ.example.com
      MFA_ACTIVE_KEY_ID: ci-mfa-old
      MFA_ENCRYPTION_KEYS: '{"ci-mfa-old":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","ci-mfa-new":"abababababababababababababababababababababababababababababababab"}'
      PLATFORM_OPERATION_ENCRYPTION_KEY: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      PLATFORM_SESSION_HOURS: "4"
      INTEGRATION_ENCRYPTION_KEY: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      PUBLIC_FORM_RATE_SALT: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      EXPORT_JOB_DIR: /tmp/univ-exports
      BACKUP_ACTIVE_KEY_ID: ci-backup-old
      BACKUP_ENCRYPTION_KEYS: '{"ci-backup-old":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","ci-backup-new":"abababababababababababababababababababababababababababababababab"}'
      BACKUP_DIR: ${{ github.workspace }}/.univ/ci-backups
      AUDIT_SEAL_DIR: /tmp/univ-audit-seals
      AUDIT_SEAL_KEY: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
      DR_REPORT_DIR: /tmp/univ-dr-reports
      DR_TARGET_RPO_MINUTES: "60"
      DR_TARGET_RTO_MINUTES: "240"
      SEED_ADMIN_PASSWORD: ci-operations-seed-password
      SEED_ALLOW_REMOTE: "1"
      PLATFORM_OPERATOR: ci-operations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: 24.20.0
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: PostgreSQL client contract
        run: psql --version
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Provision runtime roles
        run: pnpm db:setup
      - name: Seed disposable operations database
        run: pnpm seed
      - name: Build operational runtime closures
        run: pnpm check:runtime-closures
      - uses: ./.github/actions/setup-postgres-client
      - name: MFA old-key rotation drill
        env:
          MFA_ACTIVE_KEY_ID: ci-mfa-new
          MFA_ROTATION_CONFIRM: ROTATE_MFA_KEYS
        run: pnpm exec tsx scripts/mfa-rotate.mjs
      - name: Backup old-key, rekey and verify
        run: |
          manifest="$(node scripts/platform-backup.mjs create)"
          test -n "$manifest"
          node scripts/platform-backup.mjs verify --file "$manifest"
          rekeyed="$(BACKUP_ACTIVE_KEY_ID=ci-backup-new node scripts/platform-backup.mjs rekey --file "$manifest")"
          test -n "$rekeyed"
          node scripts/platform-backup.mjs verify --file "$rekeyed"
          echo "BACKUP_MANIFEST=$rekeyed" >> "$GITHUB_ENV"
      - name: Audit seal chain drill
        run: |
          seal_date="$(date -u -d 'yesterday' +%F)"
          node scripts/audit-seal.mjs create --date "$seal_date"
          node scripts/audit-seal.mjs verify --date "$seal_date"
      - name: Privilege preflight
        run: pnpm production:db-check
      - name: Compose production schema
        env:
          # Production hosts keep these files under /etc/univ-web and fail
          # closed when they are absent. CI validates the Compose graph with
          # tracked example files without manufacturing production paths or
          # attempting to start the services with example credentials.
          UNIV_WEB_WEB_ENV_FILE: ${{ github.workspace }}/.env.production.example
          UNIV_WEB_WORKER_ENV_FILE: ${{ github.workspace }}/.env.worker.example
          UNIV_WEB_PLATFORM_WORKER_ENV_FILE: ${{ github.workspace }}/.env.platform-worker.example
          UNIV_WEB_OPERATIONS_ENV_FILE: ${{ github.workspace }}/.env.operations.example
        run: docker compose -f deploy/compose.production.yml config
      - name: Background export worker drill
        env:
          # This drill must run with the tenant worker contract, not the
          # privileged operations environment inherited by this job. The
          # export path is filesystem-backed here, so the required external
          # storage/scanner origins are inert loopback contract values.
          NODE_ENV: development
          DATABASE_WORKER_URL: postgresql://univ_job_worker:worker-password@localhost:5432/univ
          DATABASE_URL: postgresql://univ_app_web:web-password@localhost:5432/univ
          EXPORT_JOB_DIR: ${{ github.workspace }}/.univ/ci-exports
          PLATFORM_OPERATOR: ci-tenant-worker
          INTEGRATION_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
          OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9100
          OBJECT_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9100
          OBJECT_STORAGE_BUCKET: univ-ci
          OBJECT_STORAGE_ACCESS_KEY_ID: ci-worker
          OBJECT_STORAGE_SECRET_ACCESS_KEY: ci-worker-secret
          ANTIVIRUS_HTTP_ENDPOINT: http://127.0.0.1:9110/scan
        run: |
          psql -v ON_ERROR_STOP=1 "$DATABASE_ADMIN_URL" <<'SQL'
          do $$
          declare
            seeded_tenant_id uuid;
            seeded_requester_id text;
          begin
            select id into seeded_tenant_id from tenants where slug='univ';
            if seeded_tenant_id is null then
              raise exception 'seeded tenant univ is missing';
            end if;
            perform set_config('app.tenant_id', seeded_tenant_id::text, false);
            select id into seeded_requester_id
              from "user"
             where tenant_id=seeded_tenant_id
               and display_username='admin'
               and must_change_password=false
             limit 1;
            if seeded_requester_id is null then
              raise exception 'seeded administrator is missing';
            end if;
            insert into jobs(tenant_id,requested_by,kind)
            values (seeded_tenant_id,seeded_requester_id,'export.students');
          end
          $$;
          SQL
          env -u DATABASE_ADMIN_URL -u DATABASE_PLATFORM_URL -u APP_DB_PASSWORD \
            -u WORKER_DB_PASSWORD -u PLATFORM_DB_PASSWORD -u BETTER_AUTH_SECRET \
            -u MFA_ENCRYPTION_KEY -u MFA_ENCRYPTION_KEYS -u MFA_ACTIVE_KEY_ID \
            -u PLATFORM_OPERATION_ENCRYPTION_KEY -u BACKUP_ENCRYPTION_KEY \
            -u BACKUP_ENCRYPTION_KEYS -u BACKUP_ACTIVE_KEY_ID -u BACKUP_DIR \
            -u BACKUP_OFFSITE_DIR -u AUDIT_SEAL_KEY -u AUDIT_SEAL_DIR \
            -u PLATFORM_RESTORE_ALLOWED -u PLATFORM_CROSS_TARGET_RESTORE \
            node scripts/job-worker.mjs --once
          echo "rc.capability='data.export' export worker re-authorization drill ok"
      - name: Backup restore drill
        run: >-
          PLATFORM_RESTORE_ALLOWED=YES node scripts/platform-backup.mjs restore
          --file "$BACKUP_MANIFEST" --confirm RESTORE:univ
      - name: Build isolated production runtime images
        env:
          UNIV_RUNNER_IMAGE: univ-web:ci
        run: pnpm docker:build --target=runner
      - name: Bound Docker cleanup
        if: always()
        run: pnpm docker:cleanup --apply --keep=univ-web:ci

  e2e:
    name: Browser end-to-end suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: univ_owner
          POSTGRES_PASSWORD: ci-e2e-owner
          POSTGRES_DB: univ
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U univ_owner -d univ"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql://univ_owner:ci-e2e-owner@localhost:5432/univ
      DATABASE_URL: postgresql://univ_app_web:ci-e2e-web-password@localhost:5432/univ
      DATABASE_PLATFORM_URL: postgresql://univ_platform_worker:ci-e2e-platform-password@localhost:5432/univ
      APP_DB_PASSWORD: ci-e2e-web-password
      WORKER_DB_PASSWORD: ci-e2e-worker-password
      PLATFORM_DB_PASSWORD: ci-e2e-platform-password
      BETTER_AUTH_SECRET: 7f8a6d5c4b3a2918172635445566778899aabbccddeeff00112233445566778899
      BETTER_AUTH_URL: http://127.0.0.1:3020
      PLATFORM_OPERATION_ENCRYPTION_KEY: a1b2c3d4e5f607182736455463728190abcdefabcdefabcdefabcdefabcdefabcd
      BACKUP_ACTIVE_KEY_ID: ci-e2e-backup
      BACKUP_ENCRYPTION_KEYS: '{"ci-e2e-backup":"1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"}'
      PUBLIC_FORM_RATE_SALT: ci-e2e-public-form-rate-salt-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          node-version: 24.20.0
      - uses: ./.github/actions/setup-postgres-client
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Restore pinned Playwright browsers
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: .univ/cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - name: Install pinned Playwright browsers on cache miss
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.univ/cache/ms-playwright
        run: |
          set -euo pipefail
          mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          missing=0
          compgen -G "$PLAYWRIGHT_BROWSERS_PATH/chromium-*/chrome-linux/chrome" >/dev/null || missing=1
          compgen -G "$PLAYWRIGHT_BROWSERS_PATH/firefox-*/firefox/firefox" >/dev/null || missing=1
          compgen -G "$PLAYWRIGHT_BROWSERS_PATH/webkit-*/pw_run.sh" >/dev/null || missing=1
          if (( missing )); then
            pnpm exec playwright install chromium firefox webkit
          else
            echo "all pinned Playwright browser binaries restored from cache"
          fi
      - name: Install pinned Playwright host dependencies
        run: pnpm exec playwright install-deps chromium firefox webkit
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Provision runtime roles
        run: pnpm db:setup
      - name: Production build
        run: pnpm build
      - name: Run E2E shards against the fresh build
        run: node scripts/e2e/run.mjs --no-build
