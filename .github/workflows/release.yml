name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify-source:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Build and attest release artifacts
    needs: certify-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Create deterministic source package
        run: pnpm source:package
      - name: Generate source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign source package
        run: cosign sign-blob --yes --output-signature source.zip.sig --output-certificate source.zip.pem univ-web-*-source.zip
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: univ-web-*-source.zip
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: univ-web-${{ github.ref_name }}-release-evidence
          path: |
            univ-web-*-source.zip
            univ-web-*-source.zip.sha256
            source.zip.sig
            source.zip.pem
            sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
