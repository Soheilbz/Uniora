name: Feature request
description: Suggest an idea or operational improvement for Uniora
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please suggest new capabilities, administrative workflows, or platform improvements.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or friction is.
      placeholder: I am always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
